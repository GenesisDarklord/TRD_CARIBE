{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autenticarse</title>

    <!-- Bootstrap core CSS -->
    <link href= "{% static 'css/bootstrap.min.css' %}" rel=stylesheet>

    
    <!-- Custom styles for this template -->
    <link href="{% static 'css/signin.css' %}" rel="stylesheet">
  </head>

  <body class="text-center">
      <form action="" method="post" class="form-signin">
        {% csrf_token %}
        <img class="mb-4" src="{% static 'img/logo.jpg' %}" alt="" width="72" height="57">
        <h1 class="h3 mb-3 fw-normal">Por favor introduzca los datos</h1>

        <div class="form-floating">
          <input type="text" name="username" class="form-control" id="floatingInput" placeholder="">
          <label for="floatingInput">Nombre de Usuario</label>
        </div>
        <div class="form-floating">
          <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password">
          <label for="floatingPassword">Contraseña</label>
        </div>

        <div class="checkbox mb-3">
          <label>
            No tienes cuenta? <a href="{% url 'register' %}">Registrate</a>
          </label>
        </div>
        <button class="w-100 btn btn-lg btn-primary" type="submit">Autenticarse</button>
      </form>
  </body>
</html>
